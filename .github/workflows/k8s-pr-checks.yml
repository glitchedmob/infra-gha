name: Kubernetes PR Checks

on:
  workflow_call:
    inputs:
      kustomization-roots:
        description: Newline-separated repository paths containing Kustomizations
        required: true
        type: string
      base-revision:
        description: Base Git revision; defaults to the pull request base
        type: string
      head-revision:
        description: Head Git revision; defaults to the pull request head
        type: string
      kustomize-version:
        description: Kustomize version used to render changed Kustomizations
        type: string
        default: 5.8.1
      kubernetes-version:
        description: Kubernetes version used for schema and API deprecation checks
        type: string
        default: 1.35.0
      kubeconform-version:
        description: Kubeconform version used to validate rendered manifests
        type: string
        default: v0.8.0
      kube-linter-version:
        description: KubeLinter version used to check rendered manifests
        type: string
        default: v0.8.3
      pluto-version:
        description: Pluto version used to detect deprecated Kubernetes APIs
        type: string
        default: v5.24.1
    outputs:
      changed-kustomizations:
        description: JSON array containing changed Kustomization paths
        value: ${{ jobs.detect.outputs.kustomizations }}

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed Kustomizations
    runs-on: ubuntu-latest
    outputs:
      kustomizations: ${{ steps.detect.outputs.kustomizations }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.head-revision || github.event.pull_request.head.sha || github.sha }}

      - name: Detect changed Kustomizations
        id: detect
        uses: $/.github/actions/detect-kustomizations
        with:
          kustomization-roots: ${{ inputs.kustomization-roots }}
          base-revision: ${{ inputs.base-revision || github.event.pull_request.base.sha || github.event.before }}
          head-revision: ${{ inputs.head-revision || github.event.pull_request.head.sha || github.sha }}

  render:
    name: Check ${{ matrix.kustomization }}
    if: ${{ needs.detect.outputs.has-changes == 'true' }}
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Check out caller repository
        if: ${{ !matrix.deleted }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.head-revision || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Kustomize
        if: ${{ !matrix.deleted }}
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ inputs.kustomize-version }}

      - name: Set up Kubeconform
        if: ${{ !matrix.deleted }}
        uses: jaxxstorm/action-install-gh-release@v2.1.0
        with:
          repo: yannh/kubeconform
          tag: ${{ inputs.kubeconform-version }}
          cache: enable

      - name: Set up KubeLinter
        if: ${{ !matrix.deleted }}
        uses: jaxxstorm/action-install-gh-release@v2.1.0
        with:
          repo: stackrox/kube-linter
          tag: ${{ inputs.kube-linter-version }}
          asset-name: kube-linter
          arch: kube-linter
          cache: enable

      - name: Set up Pluto
        if: ${{ !matrix.deleted }}
        uses: jaxxstorm/action-install-gh-release@v2.1.0
        with:
          repo: FairwindsOps/pluto
          tag: ${{ inputs.pluto-version }}
          cache: enable

      - name: Render Kustomization
        if: ${{ !matrix.deleted }}
        env:
          KUSTOMIZATION_PATH: ${{ matrix.kustomization }}
        run: kustomize build "./$KUSTOMIZATION_PATH" > "$RUNNER_TEMP/rendered.yaml"

      - name: Validate Kubernetes schemas
        if: ${{ !matrix.deleted }}
        env:
          KUBERNETES_VERSION: ${{ inputs.kubernetes-version }}
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version "${KUBERNETES_VERSION#v}" \
            "$RUNNER_TEMP/rendered.yaml"

      - name: Lint Kubernetes resources
        if: ${{ !matrix.deleted }}
        run: kube-linter lint "$RUNNER_TEMP/rendered.yaml"

      - name: Detect deprecated Kubernetes APIs
        if: ${{ !matrix.deleted }}
        env:
          KUBERNETES_VERSION: ${{ inputs.kubernetes-version }}
        run: |
          pluto detect "$RUNNER_TEMP/rendered.yaml" \
            --components k8s \
            --output wide \
            --target-versions "k8s=v${KUBERNETES_VERSION#v}"

      - name: Record deleted Kustomization
        if: ${{ matrix.deleted }}
        env:
          KUSTOMIZATION_PATH: ${{ matrix.kustomization }}
        run: echo "Kustomization \`$KUSTOMIZATION_PATH\` was removed; there is no head target to render." >> "$GITHUB_STEP_SUMMARY"

      - name: Add Kustomization summary
        if: ${{ always() }}
        env:
          DELETED: ${{ matrix.deleted }}
          KUSTOMIZATION_PATH: ${{ matrix.kustomization }}
        run: |
          {
            echo "## $KUSTOMIZATION_PATH"
            echo
            echo "- Kustomization: \`$KUSTOMIZATION_PATH\`"
            echo "- Deleted: \`$DELETED\`"
          } >> "$GITHUB_STEP_SUMMARY"

  result:
    name: Kubernetes checks
    if: ${{ always() }}
    needs:
      - detect
      - render
    runs-on: ubuntu-latest
    env:
      DETECT_RESULT: ${{ needs.detect.result }}
      HAS_CHANGES: ${{ needs.detect.outputs.has-changes }}
      RENDER_RESULT: ${{ needs.render.result }}
    steps:
      - name: Check results
        run: |
          set -euo pipefail
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "Kustomization detection failed" >&2
            exit 1
          fi
          if [ "$HAS_CHANGES" = "true" ] && [ "$RENDER_RESULT" != "success" ]; then
            echo "One or more Kustomization checks failed" >&2
            exit 1
          fi
