name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/scripts/**

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ github.event_name != 'pull_request' || steps.ci.outputs.any_changed == 'true' }}
      kubernetes-detector: ${{ github.event_name != 'pull_request' || steps.kubernetes-detector.outputs.any_changed == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: ci
        uses: tj-actions/changed-files@v47
        with:
          files: |
            .github/workflows/**
            .github/actions/**
            .github/scripts/**
      - id: kubernetes-detector
        uses: tj-actions/changed-files@v47
        with:
          files: .github/actions/detect-kustomizations/**

  actionlint:
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: raven-actions/actionlint@v2
        with:
          # The latest actionlint release predates these GitHub features.
          flags: >-
            -ignore
            (workflow_(repository|sha).*not.defined|specifying.action.*detect-kustomizations.*ref.is.missing)

      - name: Validate workflow scripts
        run: |
          bash -n .github/scripts/*.sh
          shellcheck .github/scripts/*.sh
          for script in .github/scripts/*.js .github/actions/*/*.js; do
            [ -f "$script" ] || continue
            node --check "$script"
          done

  kubernetes-detector-tests:
    name: Kubernetes detector tests
    needs: changes
    if: needs.changes.outputs.kubernetes-detector == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test detector
        run: node --test .github/actions/detect-kustomizations/index.test.js

  ci-checks:
    name: CI checks
    if: always()
    needs: [changes, actionlint, kubernetes-detector-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35
        with:
          allowed-skips: actionlint, kubernetes-detector-tests
          jobs: ${{ toJSON(needs) }}
