name: CI

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/scripts/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/scripts/**

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: raven-actions/actionlint@v2
        with:
          # GitHub documents these reusable-workflow contexts, but the latest
          # actionlint release predates them.
          flags: >-
            -ignore 'property "workflow_(repository|sha)" is not defined'

      - name: Validate workflow scripts
        run: |
          bash -n .github/scripts/*.sh
          shellcheck .github/scripts/*.sh
          for script in .github/scripts/*.js; do
            node --check "$script"
          done
